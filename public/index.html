<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loy Krathong Live 9:16</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #030712;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ฉากหลังคืนวันเพ็ญ (CSS Background แก้ปัญหาจอดำ) */
        #game-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #050b18 0%, #101f42 50%, #0d2b45 80%, #051622 100%), url('bg.jpg') no-repeat center center/cover;
            overflow: hidden;
        }

        /* ดวงจันทร์คืนวันเพ็ญเรืองแสง */
        .moon {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #fffdf0 20%, #ffea9f 60%, rgba(255, 234, 159, 0) 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 234, 159, 0.8), 0 0 100px rgba(255, 200, 80, 0.4);
            pointer-events: none;
        }

        /* 🏆 ป้ายนับยอดกระทงมุมขวาบน */
        #counter-box {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            border: 1.5px solid #ffd700;
            border-radius: 20px;
            padding: 6px 14px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 10px rgba(255, 215, 0, 0.3);
            z-index: 100;
        }
        #counter-box .title {
            font-size: 11px;
            color: #ffe066;
        }
        #counter-box .number {
            font-size: 20px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 8px #ff9800;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .counter-pop {
            transform: scale(1.35);
        }

        /* 🎛️ ปุ่มเครื่องมือทดสอบ */
        #toggle-panel-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            z-index: 101;
            backdrop-filter: blur(6px);
        }

        #test-panel {
            position: absolute;
            top: 52px;
            left: 15px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            padding: 12px;
            border-radius: 12px;
