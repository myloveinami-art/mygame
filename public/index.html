<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loy Krathong Live 9:16</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #020712;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* 🔘 หน้าจอต้อนรับกดเปิดเสียง */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(2, 7, 18, 0.92);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #start-btn {
            margin-top: 24px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            color: #020712;
            background: linear-gradient(135deg, #ffd700, #ff9800);
            border: none;
            border-radius: 30px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            cursor: pointer;
        }

        /* 🌕 ฉากหลังบรรยากาศคืนวันเพ็ญลอยกระทง (SVG Embedded 100%) */
        #game-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #030a16 0%, #0a1d3a 40%, #06172b 75%, #020b18 100%);
            overflow: hidden;
        }

        /* ดวงจันทร์เต็มดวงเรืองแสง */
        .moon {
            position: absolute;
            top: 12%;
            right: 12%;
            width: 85px;
            height: 85px;
            background: radial-gradient(circle, #fffdf0 50%, #ffe066 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px #ffe066, 0 0 70px rgba(255, 224, 102, 0.4);
        }

        /* เงาสถาปัตยกรรมวัดอรุณฯ ยามค่ำคืน */
        .wat-arun-svg {
            position: absolute;
            bottom: 38%;
            width: 100%;
            height: 160px;
            pointer-events: none;
        }

        /* แม่น้ำเจ้าพระยาสะท้อนแสง */
        .river-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, #010814 0%, #061a33 70%, rgba(10, 29, 58, 0.5) 100%);
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.8);
        }

        /* 🏆 ป้ายนับยอดกระทงมุมขวาบน */
        #counter-box {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(2, 7, 18, 0.85);
            backdrop-filter: blur(6px);
            border: 1.5px solid #ffd700;
            border-radius: 20px;
            padding: 6px 14px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 10px rgba(255, 215, 0, 0.3);
            z-index: 100;
        }
        #counter-box .title {
            font-size: 11px;
            color: #ffe066;
        }
        #counter-box .number {
            font-size: 20px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 8px #ff9800;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .counter-pop {
            transform: scale(1.35);
        }

        /* 🎛️ ปุ่มเครื่องมือทดสอบ */
        #toggle-panel-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(2, 7, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            z-index: 101;
            backdrop-filter: blur(6px);
        }

        #test-panel {
            position: absolute;
            top: 52px;
            left: 15px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            background: rgba(2, 7, 18, 0.95);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 150px;
        }
        #test-panel.show {
            display: flex;
        }
        .btn-tier {
            padding: 7px 10px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            text-align: left;
        }
        #sound-toggle {
            background: #ff9800;
            color: #000;
            text-align: center;
        }

        /* องค์ประกอบกระทงและของขวัญ */
        .gift-element {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            will-change: transform, opacity;
            pointer-events: none;
        }
        .avatar {
            border-radius: 50%;
            object-fit: cover;
        }
        .username {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            margin-bottom: 2px;
            border: 1px solid #ffd700;
            white-space: nowrap;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .icon-display {
            margin-top: -10px;
            line-height: 1;
        }

        /* Tier Animations */
        .anim-t1 { animation: floatRiver 11s ease-out forwards, sway 3s ease-in-out infinite alternate; }
        .anim-t1 .avatar { width: 42px; height: 42px; border: 2px solid #fff; }
        .anim-t1 .icon-display { font-size: 32px; }

        .anim-t2 { animation: floatRiver 13s ease-out forwards, sway 3s ease-in-out infinite alternate; }
        .anim-t2 .avatar { width: 52px; height: 52px; border: 2px solid #ffd700; box-shadow: 0 0 8px #ffd700; }
        .anim-t2 .icon-display { font-size: 40px; filter: drop-shadow(0 0 6px #ff9900); }

        .anim-t3 { animation: floatRiver 15s ease-out forwards, sway 2.5s ease-in-out infinite alternate; }
        .anim-t3 .avatar { width: 62px; height: 62px; border: 3px solid #fff; box-shadow: 0 0 15px #ffea00; }
        .anim-t3 .icon-display { font-size: 50px; filter: drop-shadow(0 0 12px #ffea00); }

        .anim-t4 { animation: floatSky 13s ease-out forwards, sway 2s ease-in-out infinite alternate; }
        .anim-t4 .avatar { width: 55px; height: 55px; border: 2.5px solid #ff9800; box-shadow: 0 0 12px #ff9800; }
        .anim-t4 .icon-display { font-size: 42px; filter: drop-shadow(0 0 10px #ff9800); }

        .anim-t5 { animation: firework 5s ease-out forwards; }
        .anim-t5 .avatar { width: 70px; height: 70px; border: 3px solid #00e5ff; box-shadow: 0 0 20px #00e5ff; }
        .anim-t5 .icon-display { font-size: 55px; filter: drop-shadow(0 0 15px #ff0055); }

        .anim-t6 { animation: firework 6.5s ease-out forwards; }
        .anim-t6 .avatar { width: 85px; height: 85px; border: 4px solid #ff0055; box-shadow: 0 0 25px #ff0055; }
        .anim-t6 .icon-display { font-size: 70px; filter: drop-shadow(0 0 25px #ffea00); }

        .anim-t7 { animation: ultimateUniverse 9s ease-out forwards; }
        .anim-t7 .avatar { width: 100px; height: 100px; border: 4px solid #fff; box-shadow: 0 0 35px #fff, 0 0 60px #ff00e5; }
        .anim-t7 .icon-display { font-size: 85px; filter: drop-shadow(0 0 30px #ff00e5); }

        @keyframes floatRiver {
            0% { bottom: 2%; transform: scale(1); opacity: 1; }
            100% { bottom: 36%; transform: scale(0.3); opacity: 0; }
        }
        @keyframes floatSky {
            0% { bottom: 25%; transform: scale(1); opacity: 1; }
            100% { bottom: 90%; transform: scale(0.35); opacity: 0; }
        }
        @keyframes firework {
            0% { transform: scale(0.2); opacity: 0; }
            40% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        @keyframes ultimateUniverse {
            0% { transform: scale(0.2) rotate(-20deg); opacity: 0; }
            30% { transform: scale(1.3) rotate(0deg); opacity: 1; }
            70% { transform: scale(1.4) rotate(10deg); opacity: 1; }
            100% { transform: scale(1.8) rotate(20deg); opacity: 0; }
        }
        @keyframes sway {
            0% { margin-left: -8px; }
            100% { margin-left: 8px; }
        }
    </style>
</head>
<body>

    <!-- 🔘 หน้าจอกดเปิดเสียงออนไลน์ -->
    <div id="start-overlay">
        <h2>🪷 ไลฟ์สดคืนวันเพ็ญลอยกระทง 🪷</h2>
        <p style="font-size: 13px; margin-top: 8px; color: #ffe066;">แตะปุ่มเพื่อเปิดใช้งานระบบเสียงดนตรีสด</p>
        <button id="start-btn">🎵 เริ่มต้นใช้งาน (เปิดเสียง)</button>
    </div>

    <div id="game-screen">
        <div class="moon"></div>

        <!-- กราฟิกเวกเตอร์วัดอรุณฯ ยามค่ำคืนฝังตรง -->
        <svg class="wat-arun-svg" viewBox="0 0 1000 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path fill="#020914" opacity="0.9" d="M0,200 L0,170 L100,170 L150,170 L170,120 L180,80 L190,120 L210,170 L350,170 L460,170 L480,90 L495,30 L500,10 L505,30 L520,90 L540,170 L650,170 L790,170 L810,120 L820,80 L830,120 L850,170 L1000,170 L1000,200 Z"/>
            <path fill="#ffb703" opacity="0.3" d="M495,30 L500,10 L505,30 L515,80 L485,80 Z"/>
        </svg>

        <div class="river-container"></div>

        <button id="toggle-panel-btn">⚙️ เครื่องมือ</button>

        <div id="test-panel">
            <button id="sound-toggle" class="btn-tier">🔊 เสียง: เปิด</button>
            <button class="btn-tier" data-tier="1" style="background: #8ecae6; color:#000;">T1: ดอกไม้จิ๋ว</button>
            <button class="btn-tier" data-tier="2" style="background: #2a9d8f;">T2: กระทงตอง</button>
            <button class="btn-tier" data-tier="3" style="background: #e9c46a; color:#000;">T3: กระทงทอง</button>
            <button class="btn-tier" data-tier="4" style="background: #f4a261;">T4: โคมลอย</button>
            <button class="btn-tier" data-tier="5" style="background: #e76f51;">T5: พลุฉลอง</button>
            <button class="btn-tier" data-tier="6" style="background: #d62828;">T6: มังกรฟ้า</button>
            <button class="btn-tier" data-tier="7" style="background: #9d4edd;">T7: จักรวาล</button>
        </div>

        <div id="counter-box">
            <span style="font-size:16px;">🪷</span>
            <div>
                <div class="title">ร่วมลอยกระทง</div>
                <div id="total-count" class="number">0</div>
            </div>
            <span class="title">ใบ</span>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const socket = typeof io !== 'undefined' ? io() : null;
            const gameScreen = document.getElementById('game-screen');
            const totalCountEl = document.getElementById('total-count');
            const testPanel = document.getElementById('test-panel');
            const toggleBtn = document.getElementById('toggle-panel-btn');
            const startOverlay = document.getElementById('start-overlay');
            const startBtn = document.getElementById('start-btn');
            
            let totalCount = 0;
            let soundEnabled = true;

            // 🎵 ระบบสังเคราะห์ดนตรีบรรยากาศลอยกระทง
            let audioCtx;
            let musicInterval;

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function startLoyKrathongMusic() {
                if (musicInterval || !soundEnabled) return;

                const melodyNotes = [392.00, 440.00, 523.25, 587.33, 659.25, 783.99];
                let index = 0;

                musicInterval = setInterval(() => {
                    if (!soundEnabled || !audioCtx) return;

                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(melodyNotes[index % melodyNotes.length], audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 1.2);

                    index = (index + 1) % melodyNotes.length;
                }, 600);
            }

            startBtn.addEventListener('click', () => {
                startOverlay.style.display = 'none';
                initAudio();
                startLoyKrathongMusic();
            });

            toggleBtn.addEventListener('click', () => {
                testPanel.classList.toggle('show');
            });

            function playSound(tier) {
                if (!soundEnabled) return;
                initAudio();
                const now = audioCtx.currentTime;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                if (tier <= 3) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                } else if (tier === 4) {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.8);
                    gain.gain.setValueAtTime(0
