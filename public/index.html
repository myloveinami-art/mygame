<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loy Krathong 7-Tier + Sound & Counter Interactive</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            font-family: 'Tahoma', sans-serif;
        }
        #game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: url('bg.jpg') no-repeat center center/cover;
        }

        /* 🏆 ป้ายนับยอดกระทงรวมมุมขวาบน */
        #counter-box {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 10px 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            z-index: 999;
        }
        #counter-box .title {
            font-size: 14px;
            color: #ffe066;
        }
        #counter-box .number {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px #ff9800;
            transition: transform 0.2s ease;
        }
        .counter-pop {
            transform: scale(1.3);
        }

        /* 🎛️ เมนูแผงทดสอบ + ปุ่มควบคุมเสียง */
        #test-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-width: 70vw;
            z-index: 999;
        }
        .btn-tier {
            padding: 7px 12px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        #sound-toggle {
            background: #ff9800;
            color: #000;
        }

        /* องค์ประกอบกระทงและของขวัญ */
        .gift-element {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            will-change: transform, opacity;
        }
        .avatar {
            border-radius: 50%;
            object-fit: cover;
        }
        .username {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 4px;
            border: 1px solid #ffd700;
            white-space: nowrap;
        }
        .icon-display {
            margin-top: -15px;
        }

        /* Tier Animations */
        .anim-t1 { animation: floatRiver 12s ease-out forwards, sway 3s ease-in-out infinite alternate; }
        .anim-t1 .avatar { width: 55px; height: 55px; border: 2px solid #fff; }
        .anim-t1 .icon-display { font-size: 40px; }

        .anim-t2 { animation: floatRiver 14s ease-out forwards, sway 3s ease-in-out infinite alternate; }
        .anim-t2 .avatar { width: 70px; height: 70px; border: 3px solid #ffd700; box-shadow: 0 0 10px #ffd700; }
        .anim-t2 .icon-display { font-size: 50px; filter: drop-shadow(0 0 8px #ff9900); }

        .anim-t3 { animation: floatRiver 16s ease-out forwards, sway 2.5s ease-in-out infinite alternate; }
        .anim-t3 .avatar { width: 85px; height: 85px; border: 4px solid #fff; box-shadow: 0 0 20px #ffea00; }
        .anim-t3 .icon-display { font-size: 65px; filter: drop-shadow(0 0 15px #ffea00); }

        .anim-t4 { animation: floatSky 14s ease-out forwards, sway 2s ease-in-out infinite alternate; }
        .anim-t4 .avatar { width: 75px; height: 75px; border: 3px solid #ff9800; box-shadow: 0 0 15px #ff9800; }
        .anim-t4 .icon-display { font-size: 55px; filter: drop-shadow(0 0 12px #ff9800); }

        .anim-t5 { animation: firework 5s ease-out forwards; }
        .anim-t5 .avatar { width: 90px; height: 90px; border: 4px solid #00e5ff; box-shadow: 0 0 25px #00e5ff; }
        .anim-t5 .icon-display { font-size: 70px; filter: drop-shadow(0 0 20px #ff0055); }

        .anim-t6 { animation: firework 7s ease-out forwards; }
        .anim-t6 .avatar { width: 110px; height: 110px; border: 5px solid #ff0055; box-shadow: 0 0 35px #ff0055; }
        .anim-t6 .icon-display { font-size: 90px; filter: drop-shadow(0 0 30px #ffea00); }

        .anim-t7 { animation: ultimateUniverse 10s ease-out forwards; }
        .anim-t7 .avatar { width: 140px; height: 140px; border: 6px solid #fff; box-shadow: 0 0 50px #fff, 0 0 80px #ff00e5; }
        .anim-t7 .icon-display { font-size: 110px; filter: drop-shadow(0 0 40px #ff00e5); }

        @keyframes floatRiver {
            0% { bottom: 2%; transform: scale(1.1); opacity: 1; }
            100% { bottom: 35%; transform: scale(0.25); opacity: 0; }
        }
        @keyframes floatSky {
            0% { bottom: 15%; transform: scale(1); opacity: 1; }
            100% { bottom: 88%; transform: scale(0.25); opacity: 0; }
        }
        @keyframes firework {
            0% { transform: scale(0.1); opacity: 0; }
            40% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1.7); opacity: 0; }
        }
        @keyframes ultimateUniverse {
            0% { transform: scale(0.1) rotate(-20deg); opacity: 0; }
            30% { transform: scale(1.5) rotate(0deg); opacity: 1; }
            70% { transform: scale(1.6) rotate(10deg); opacity: 1; }
            100% { transform: scale(2.2) rotate(20deg); opacity: 0; }
        }
        @keyframes sway {
            0% { margin-left: -12px; }
            100% { margin-left: 12px; }
        }
    </style>
</head>
<body>

    <!-- ป้ายสรุปยอดกระทงรวม -->
    <div id="counter-box">
        <span style="font-size:24px;">🪷</span>
        <div>
            <div class="title">ร่วมลอยกระทงแล้ว</div>
            <div id="total-count" class="number">0</div>
        </div>
        <span class="title">ใบ</span>
    </div>

    <!-- แผงปุ่มกดทดสอบ -->
    <div id="test-panel">
        <button id="sound-toggle" class="btn-tier">🔊 เสียง: เปิด</button>
        <button class="btn-tier" data-tier="1" style="background: #8ecae6; color:#000;">T1: ดอกไม้จิ๋ว</button>
        <button class="btn-tier" data-tier="2" style="background: #2a9d8f;">T2: กระทงตอง</button>
        <button class="btn-tier" data-tier="3" style="background: #e9c46a; color:#000;">T3: กระทงทอง</button>
        <button class="btn-tier" data-tier="4" style="background: #f4a261;">T4: โคมลอย</button>
        <button class="btn-tier" data-tier="5" style="background: #e76f51;">T5: พลุฉลอง</button>
        <button class="btn-tier" data-tier="6" style="background: #d62828;">T6: มังกรฟ้า</button>
        <button class="btn-tier" data-tier="7" style="background: #9d4edd;">T7: จักรวาล</button>
    </div>

    <div id="game-screen"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const socket = io();
            const gameScreen = document.getElementById('game-screen');
            const totalCountEl = document.getElementById('total-count');
            let totalCount = 0;
            let soundEnabled = true;

            // ระบบสร้างเสียงสังเคราะห์ Web Audio API (ไม่ต้องโหลดไฟล์ MP3 ข้างนอก)
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            function playSound(tier) {
                if (!soundEnabled) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;

                if (tier <= 3) {
                    // 🔔 เสียงกระดิ่ง + ป๋อมแป๋มน้ำ (T1-T3)
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3); // C6
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (tier === 4) {
                    // 🏮 เสียงลมหวีดสอยขึ้นฟ้า (T4 โคมลอย)
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.8);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.8);
                } else {
                    // 🎆 เสียงพลุระเบิดดังปัง! (T5-T7)
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
                    gain.gain.setValueAtTime(0.6, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            }

            // ปุ่มเปิด/ปิดเสียง
            const soundBtn = document.getElementById('sound-toggle');
            soundBtn.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                soundBtn.innerHTML = soundEnabled ? '🔊 เสียง: เปิด' : '🔇 เสียง: ปิด';
                soundBtn.style.background = soundEnabled ? '#ff9800' : '#757575';
            });

            const giftTierMap = {
                'Rose': { tier: 1, icon: '🌸' },
                'TikTok': { tier: 1, icon: '🪷' },
                'Finger Heart': { tier: 2, icon: '🕯️' },
                'Doughnut': { tier: 2, icon: '🪷' },
                'Perfume': { tier: 3, icon: '✨' },
                'Cap': { tier: 3, icon: '👑' },
                'Paper Crane': { tier: 4, icon: '🏮' },
                'Fireworks': { tier: 5, icon: '🎆' },
                'Dragon': { tier: 6, icon: '🐉' },
                'Universe': { tier: 7, icon: '🌌' }
            };

            socket.on('new_gift', (data) => {
                renderGift(data.username, data.avatarUrl, data.giftName);
            });

            function renderGift(username, avatarUrl, giftName) {
                const giftInfo = giftTierMap[giftName] || { tier: 1, icon: '🪷' };
                const tier = giftInfo.tier;

                // 1. เพิ่มยอดนับกระทงรวม
                totalCount++;
                totalCountEl.innerText = totalCount.toLocaleString();
                totalCountEl.classList.add('counter-pop');
                setTimeout(() => totalCountEl.classList.remove('counter-pop'), 200);

                // 2. เล่นเสียงเอฟเฟกต์ตาม Tier
                playSound(tier);

                // 3. แสดงอนิเมชันกระทง/ของขวัญ
                const container = document.createElement('div');
                container.className = `gift-element anim-t${tier}`;

                if (tier <= 3) {
                    const randomLeft = Math.floor(Math.random() * 70) + 15;
                    container.style.left = `${randomLeft}%`;
                } else if (tier === 4) {
                    const randomLeft = Math.floor(Math.random() * 80) + 10;
                    container.style.left = `${randomLeft}%`;
                } else {
                    const randomLeft = Math.floor(Math.random() * 60) + 20;
                    const randomTop = Math.floor(Math.random() * 30) + 15;
                    container.style.left = `${randomLeft}%`;
                    container.style.top = `${randomTop}%`;
                }

                container.innerHTML = `
                    <div class="username">${username} (T${tier})</div>
                    <img class="avatar" src="${avatarUrl}" alt="${username}">
                    <div class="icon-display">${giftInfo.icon}</div>
                `;

                gameScreen.appendChild(container);

                const durations = [0, 12000, 14000, 16000, 14000, 5000, 7000, 10000];
                setTimeout(() => { container.remove(); }, durations[tier] || 10000);
            }

            // ผูก Event ปุ่มกดทดสอบ
            document.querySelectorAll('.btn-tier[data-tier]').forEach(button => {
                button.addEventListener('click', () => {
                    const selectedTier = parseInt(button.getAttribute('data-tier'));
                    const mockUsers = ['พี่โอ๊ต', 'สายมู', 'น้องแป้ง', 'สมชาย', 'NARAPONZ'];
                    const randomUser = mockUsers[Math.floor(Math.random() * mockUsers.length)];
                    const avatar = 'https://p16-va.tiktokcdn.com/musically-maliva-obj/1665203342371846~c5_100x100.jpeg';
                    const giftNames = ['', 'Rose', 'Finger Heart', 'Perfume', 'Paper Crane', 'Fireworks', 'Dragon', 'Universe'];

                    renderGift(randomUser, avatar, giftNames[selectedTier]);
                });
            });
        });
    </script>
</body>
</html>
