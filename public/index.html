<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loy Krathong Wat Arun Live 9:16</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #04091a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #art-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* หน้าจอต้อนรับปลดล็อกเสียง */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(16, 33, 68, 0.92), rgba(3, 7, 18, 0.98));
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #start-btn {
            margin-top: 24px;
            padding: 15px 32px;
            font-size: 17px;
            font-weight: bold;
            color: #04091a;
            background: linear-gradient(135deg, #ffe066, #ff9800);
            border: none;
            border-radius: 30px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.7);
            cursor: pointer;
        }

        /* ป้ายนับยอดกระทงมุมขวาบน */
        #counter-box {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(4, 9, 26, 0.8);
            backdrop-filter: blur(6px);
            border: 1.5px solid #ffd700;
            border-radius: 20px;
            padding: 6px 14px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 12px rgba(255, 215, 0, 0.35);
            z-index: 100;
        }
        #counter-box .title { font-size: 11px; color: #ffe066; }
        #counter-box .number {
            font-size: 20px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 8px #ff9800;
            transition: transform 0.2s;
        }
        .counter-pop { transform: scale(1.35); }

        /* ปุ่มเครื่องมือทดสอบ */
        #toggle-panel-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(4, 9, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            z-index: 101;
            backdrop-filter: blur(6px);
        }
        #test-panel {
            position: absolute;
            top: 52px;
            left: 15px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            background: rgba(4, 9, 26, 0.92);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            width: 160px;
        }
        #test-panel.show { display: flex; }
        .btn-tier {
            padding: 7px 10px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            text-align: left;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div style="font-size: 48px; margin-bottom: 10px;">🪷🌕🏯</div>
        <h2>ลอยกระทงวัดอรุณฯ 2.5D Live</h2>
        <p style="font-size: 13px; margin-top: 8px; color: #ffe066;">แตะปุ่มด้านล่างเพื่อเปิดเพลงรำวงวันลอยกระทงและเริ่มงาน</p>
        <button id="start-btn">🎵 เข้าสู่งานลอยกระทง</button>
    </div>

    <canvas id="art-canvas"></canvas>

    <button id="toggle-panel-btn">⚙️ เครื่องมือ</button>

    <div id="test-panel">
        <button id="sound-toggle" class="btn-tier" style="background:#ff9800; color:#000; text-align:center;">🔊 เสียงเพลง: เปิด</button>
        <button class="btn-tier" data-tier="1" style="background: #8ecae6; color:#000;">T1: กระทงดอกไม้จิ๋ว</button>
        <button class="btn-tier" data-tier="2" style="background: #2a9d8f;">T2: กระทงใบตอง</button>
        <button class="btn-tier" data-tier="3" style="background: #e9c46a; color:#000;">T3: กระทงทองคำ</button>
        <button class="btn-tier" data-tier="4" style="background: #f4a261;">T4: โคมลอยขึ้นฟ้า</button>
        <button class="btn-tier" data-tier="5" style="background: #e76f51;">T5: กระทงทอง + พลุ</button>
        <button class="btn-tier" data-tier="6" style="background: #d62828;">T6: มังกรฟ้า + พลุใหญ่</button>
        <button class="btn-tier" data-tier="7" style="background: #9d4edd;">T7: จักรวาลอลังการ</button>
    </div>

    <div id="counter-box">
        <span style="font-size:16px;">🪷</span>
        <div>
            <div class="title">ร่วมลอยกระทง</div>
            <div id="total-count" class="number">0</div>
        </div>
        <span class="title">ใบ</span>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const socket = typeof io !== 'undefined' ? io() : null;
            const canvas = document.getElementById('art-canvas');
            const ctx = canvas.getContext('2d');
            const totalCountEl = document.getElementById('total-count');
            const startOverlay = document.getElementById('start-overlay');
            const startBtn = document.getElementById('start-btn');
            const toggleBtn = document.getElementById('toggle-panel-btn');
            const testPanel = document.getElementById('test-panel');

            let W = canvas.width = window.innerWidth;
            let H = canvas.height = window.innerHeight;
            let totalCount = 0;
            let soundEnabled = true;

            window.addEventListener('resize', () => {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            });

            toggleBtn.addEventListener('click', () => testPanel.classList.toggle('show'));

            // ==========================================
            // 1. วาดฉากหลังวัดอรุณฯ คืนวันเพ็ญระดับงานอาร์ต
            // ==========================================
            const stars = Array.from({ length: 70 }, () => ({
                x: Math.random(),
                y: Math.random() * 0.42,
                r: Math.random() * 1.5 + 0.5,
                twinkle: Math.random() * Math.PI * 2
            }));

            function drawBackground(time) {
                const horizonY = H * 0.44;
                const pierTopY = H * 0.64;

                // 1. ท้องฟ้ายามค่ำคืนไล่เฉดสีน้ำเงินเข้ม-ม่วงคราม
                const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
                skyGrad.addColorStop(0, '#04091a');
                skyGrad.addColorStop(0.55, '#0b1d42');
                skyGrad.addColorStop(1, '#1a3668');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, horizonY);

                // ดวงดาวระยิบระยับ
                stars.forEach(s => {
                    const alpha = 0.4 + 0.6 * Math.abs(Math.sin(time * 0.002 + s.twinkle));
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 2. พระจันทร์เต็มดวงเรืองแสงนวล
                const moonX = W * 0.78;
                const moonY = H * 0.16;
                const moonR = Math.min(W, H) * 0.085;
                const moonGlow = ctx.createRadialGradient(moonX, moonY, moonR * 0.5, moonX, moonY, moonR * 3.2);
                moonGlow.addColorStop(0, 'rgba(255, 248, 214, 0.95)');
                moonGlow.addColorStop(0.35, 'rgba(255, 224, 102, 0.35)');
                moonGlow.addColorStop(1, 'rgba(255, 224, 102, 0)');
                ctx.fillStyle = moonGlow;
                ctx.beginPath();
                ctx.arc(moonX, moonY, moonR * 3.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fffdf0';
                ctx.beginPath();
                ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
                ctx.fill();

                // 3. วาดองค์พระปรางค์วัดอรุณราชวรารามเรืองแสงสีทองอร่าม
                drawWatArun(W * 0.46, horizonY, Math.min(W * 0.65, H * 0.34));

                // 4. แม่น้ำเจ้าพระยา (ระหว่าง horizonY ถึง pierTopY)
                const riverGrad = ctx.createLinearGradient(0, horizonY, 0, pierTopY);
                riverGrad.addColorStop(0, '#071936');
                riverGrad.addColorStop(0.5, '#0c2752');
                riverGrad.addColorStop(1, '#06152d');
                ctx.fillStyle = riverGrad;
                ctx.fillRect(0, horizonY, W, pierTopY - horizonY);

                // เงาสะท้อนสีทองของวัดอรุณฯ และดวงจันทร์บนผิวน้ำ
                ctx.save();
                for (let i = 0; i < 18; i++) {
                    const waveY = horizonY + ((pierTopY - horizonY) * (i / 18));
                    const waveW = (W * 0.35) * (1 - i * 0.03) + Math.sin(time * 0.004 + i) * 12;
                    ctx.fillStyle = `rgba(255, 195, 50, ${0.18 - i * 0.008})`;
                    ctx.beginPath();
                    ctx.ellipse(W * 0.46 + Math.sin(time * 0.003 + i) * 6, waveY, waveW, 2.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // 5. ท่าน้ำและลานทางเดินริมแม่น้ำ (พื้นล่าง)
                const pierGrad = ctx.createLinearGradient(0, pierTopY, 0, H);
                pierGrad.addColorStop(0, '#222b3d');
                pierGrad.addColorStop(1, '#111622');
                ctx.fillStyle = pierGrad;
                ctx.fillRect(0, pierTopY, W, H - pierTopY);

                // ขอบท่าน้ำประดับลายไทยสีทองและโคมไฟเสา
                ctx.fillStyle = '#d4a338';
                ctx.fillRect(0, pierTopY - 4, W, 6);
                ctx.fillStyle = '#3b475e';
                ctx.fillRect(0, pierTopY + 2, W, 10);

                // เสาไฟริมท่าน้ำซ้าย-ขวา
                drawPierLantern(W * 0.12, pierTopY, time);
                drawPierLantern(W * 0.88, pierTopY, time);
            }

            function drawWatArun(cx, baseY, scaleH) {
                ctx.save();
                // แสงออร่าสีทองหลังพระปรางค์
                const aura = ctx.createRadialGradient(cx, baseY - scaleH * 0.45, 10, cx, baseY - scaleH * 0.45, scaleH * 0.85);
                aura.addColorStop(0, 'rgba(255, 190, 40, 0.45)');
                aura.addColorStop(1, 'rgba(255, 150, 0, 0)');
                ctx.fillStyle = aura;
                ctx.beginPath();
                ctx.arc(cx, baseY - scaleH * 0.45, scaleH * 0.85, 0, Math.PI * 2);
                ctx.fill();

                // ฟังก์ชันวาดทรงพระปรางค์ซ้อนชั้นวิจิตร
                function drawPrangTower(x, y, w, h) {
                    const grad = ctx.createLinearGradient(x - w / 2, y - h, x + w / 2, y);
                    grad.addColorStop(0, '#fff3b0');
                    grad.addColorStop(0.5, '#f4a261');
                    grad.addColorStop(1, '#9c6615');
                    ctx.fillStyle = grad;

                    // ฐานซ้อน 3 ชั้น
                    ctx.fillRect(x - w * 0.65, y - h * 0.15, w * 1.3, h * 0.15);
                    ctx.fillRect(x - w * 0.52, y - h * 0.28, w * 1.04, h * 0.13);

                    // เรือนธาตุโค้งเรียวขึ้นยอด
                    ctx.beginPath();
                    ctx.moveTo(x - w * 0.42, y - h * 0.28);
                    ctx.quadraticCurveTo(x - w * 0.35, y - h * 0.68, x, y - h);
                    ctx.quadraticCurveTo(x + w * 0.35, y - h * 0.68, x + w * 0.42, y - h * 0.28);
                    ctx.closePath();
                    ctx.fill();

                    // ลวดลายชั้นบัวสีทองคาดขวาง
                    ctx.strokeStyle = '#ffea79';
                    ctx.lineWidth = 1.5;
                    for (let tier = 0.35; tier <= 0.82; tier += 0.11) {
                        const tw = w * (0.42 * (1 - (tier - 0.28) * 1.25));
                        ctx.beginPath();
                        ctx.moveTo(x - tw, y - h * tier);
                        ctx.lineTo(x + tw, y - h * tier);
                        ctx.stroke();
                    }
                }

                // ปรางค์ทิศซ้าย-ขวา
                drawPrangTower(cx - scaleH * 0.48, baseY, scaleH * 0.28, scaleH * 0.56);
                drawPrangTower(cx + scaleH * 0.48, baseY, scaleH * 0.28, scaleH * 0.56);
                // องค์พระปรางค์ประธานตรงกลาง
                drawPrangTower(cx, baseY, scaleH * 0.44, scaleH * 0.96);

                // กำแพงแก้วริมน้ำหน้าวัด
                ctx.fillStyle = '#e9c46a';
                ctx.fillRect(cx - scaleH * 0.85, baseY - 10, scaleH * 1.7, 10);
                ctx.restore();
            }

            function drawPierLantern(x, y, time) {
                ctx.save();
                ctx.fillStyle = '#4a3511';
                ctx.fillRect(x - 3, y - 42, 6, 42);
                const glow = 0.85 + Math.sin(time * 0.008) * 0.15;
                ctx.fillStyle = `rgba(255, 200, 60, ${glow})`;
                ctx.beginPath();
                ctx.arc(x, y - 48, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // ==========================================
            // 2. ตัวละครการ์ตูนชุดไทย Chibi สวยงามมีชีวิตชีวา
            // ==========================================
            const outfitStyles = [
                { top: '#ff595e', bottom: '#6a040f', gender: 'F', hair: '#1b1b1b' },
                { top: '#ffca3a', bottom: '#3a0ca3', gender: 'M', hair: '#222222' },
                { top: '#ff70a6', bottom: '#8338ec', gender: 'F', hair: '#2b1d12' },
                { top: '#4cc9f0', bottom: '#1d3557', gender: 'M', hair: '#1a1a1a' },
                { top: '#8ac926', bottom: '#2b2d42', gender: 'F', hair: '#1b1b1b' },
                { top: '#f77f00', bottom: '#540b0e', gender: 'M', hair: '#24170e' }
            ];

            const characters = [];
            const rows = [0.73, 0.82, 0.91];
            const cols = [0.18, 0.34, 0.50, 0.66, 0.82];

            rows.forEach((ry, rIdx) => {
                cols.forEach((cx, cIdx) => {
                    const jitterX = (Math.random() - 0.5) * 0.05;
                    const jitterY = (Math.random() - 0.5) * 0.02;
                    characters.push({
                        homeX: cx + jitterX,
                        homeY: ry + jitterY,
                        x: cx + jitterX,
                        y: ry + jitterY,
                        style: outfitStyles[(rIdx * 5 + cIdx) % outfitStyles.length],
                        state: 'idle', // idle, walkingUp, placing, walkingBack
                        walkPhase: Math.random() * Math.PI * 2,
                        heldTier: 0,
                        username: '',
                        avatarImg: null
                    });
                });
            });

            function drawCartoonCharacter(ch, time) {
                const px = ch.x * W;
                const py = ch.y * H;
                // ปรับขนาดตามระยะใกล้-ไกล (Perspective)
                const scale = 0.72 + (ch.y - 0.62) * 1.15;

                ctx.save();
                ctx.translate(px, py);
                ctx.scale(scale, scale);

                const isMoving = (ch.state === 'walkingUp' || ch.state === 'walkingBack');
                const bobY = isMoving ? Math.abs(Math.sin(ch.walkPhase)) * -5 : Math.sin(time * 0.004 + ch.walkPhase) * 1.5;
                const legSwing = isMoving ? Math.sin(ch.walkPhase) * 7 : 0;

                // เงาใต้เท้าบนพื้นท่าน้ำ
                ctx.fillStyle = 'rgba(0, 0, 0, 0.38)';
                ctx.beginPath();
                ctx.ellipse(0, 0, 18, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.translate(0, bobY);

                // ขาซ้าย-ขวา
                ctx.fillStyle = '#f4cba3';
                ctx.beginPath();
                ctx.roundRect(-9, -22 + legSwing * 0.5, 6, 20, 3);
                ctx.roundRect(3, -22 - legSwing * 0.5, 6, 20, 3);
                ctx.fill();

                // รองเท้าแตะไทยน่ารัก
                ctx.fillStyle = '#5c3a21';
                ctx.beginPath();
                ctx.ellipse(-6, -2 + legSwing * 0.5, 5, 2.5, 0, 0, Math.PI * 2);
                ctx.ellipse(6, -2 - legSwing * 0.5, 5, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // ผ้านุ่งโจงกระเบน / ผ้าถุงไทย
                ctx.fillStyle = ch.style.bottom;
                ctx.beginPath();
                ctx.moveTo(-13, -42);
                ctx.lineTo(13, -42);
                ctx.lineTo(15, -18);
                ctx.lineTo(-15, -18);
                ctx.closePath();
                ctx.fill();

                // เข็มขัดทองคาดเอว
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(-13, -44, 26, 3.5);

                // เสื้อไทย / สไบเฉียง (มุมมองด้านหลังเฉียงสวยงาม)
                ctx.fillStyle = ch.style.top;
                ctx.beginPath();
                ctx.roundRect(-14, -66, 28, 24, 8);
                ctx.fill();

                if (ch.style.gender === 'F') {
                    // ชายสไบพาดไหล่ด้านหลัง
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                    ctx.beginPath();
                    ctx.moveTo(-11, -66);
                    ctx.lineTo(-2, -66);
                    ctx.lineTo(12, -32);
                    ctx.lineTo(4, -32);
                    ctx.closePath();
                    ctx.fill();
                }

                // แขนซ้าย-ขวา
                ctx.fillStyle = '#ffdbac';
                ctx.beginPath();
                ctx.roundRect(-18, -63, 5.5, 19, 3);
                ctx.roundRect(12.5, -63, 5.5, 19, 3);
                ctx.fill();

                // ศีรษะการ์ตูน Chibi + ทรงผมละเอียด
                ctx.fillStyle = '#ffdbac';
                ctx.beginPath();
                ctx.arc(0, -82, 17, 0, Math.PI * 2);
                ctx.fill();

                // ผมด้านหลัง
                ctx.fillStyle = ch.style.hair;
                ctx.beginPath();
                ctx.arc(0, -84, 17.8, Math.PI * 0.85, Math.PI * 2.15);
                ctx.quadraticCurveTo(17, -70, 0, -72);
                ctx.quadraticCurveTo(-17, -70, -17.8, -84);
                ctx.fill();

                // ถ้าเป็นผู้หญิง เพิ่มมวยผมและปิ่นปักผมทองคำ
                if (ch.style.gender === 'F') {
                    ctx.beginPath();
                    ctx.arc(0, -101, 7.5, 0, Math.PI * 2);
                    ctx.fill();
                    // ปิ่นปักผมทอง
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-11, -103);
                    ctx.lineTo(11, -99);
                    ctx.stroke();
                }

                // วาดกระทงหรือโคมลอยในมือขณะกำลังเดินไปลอย
                if (ch.heldTier > 0) {
                    if (ch.heldTier === 4) {
                        drawLanternArt(0, -68, 0.65, time);
                    } else {
                        drawKrathongArt(0, -54, ch.heldTier, 0.75, time);
                    }
                }

                // ป้ายชื่อคนส่งของขวัญเหนือศีรษะ
                if (ch.username) {
                    const tagY = ch.style.gender === 'F' ? -118 : -110;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 1.2;
                    const textW = Math.max(54, ch.username.length * 7 + 16);
                    ctx.beginPath();
                    ctx.roundRect(-textW / 2, tagY - 16, textW, 18, 9);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(ch.username, 0, tagY - 3);
                }

                ctx.restore();
            }

            // ==========================================
            // 3. วาดกระทง 3 ระดับ + โคมลอย + พลุสวยงาม
            // ==========================================
            function drawKrathongArt(x, y, tier, scale, time) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);

                const glowR = tier >= 3 ? 34 : 20;
                const glow = ctx.createRadialGradient(0, -8, 2, 0, -8, glowR);
                glow.addColorStop(0, tier >= 3 ? 'rgba(255, 225, 80, 0.8)' : 'rgba(255, 190, 60, 0.55)');
                glow.addColorStop(1, 'rgba(255, 180, 0, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0, -8, glowR, 0, Math.PI * 2);
                ctx.fill();

                if (tier === 1) {
                    // T1: กระทงดอกไม้จิ๋ว
                    ctx.fillStyle = '#40916c';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 12, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff758f';
                    ctx.beginPath();
                    ctx.arc(0, -4, 6, 0, Math.PI * 2);
                    ctx.fill();
                } else if (tier === 2) {
                    // T2: กระทงใบตองกลีบดอกไม้
                    ctx.fillStyle = '#2d6a4f';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 17, 7, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffb703';
                    for (let a = -12; a <= 12; a += 6) {
                        ctx.beginPath();
                        ctx.arc(a, -4, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else {
                    // T3+: กระทงทองคำหรูหรา
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 22, 9, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff9f1c';
                    ctx.beginPath();
                    ctx.moveTo(-16, -2);
                    ctx.lineTo(0, -14);
                    ctx.lineTo(16, -2);
                    ctx.closePath();
                    ctx.fill();
                }

                // เทียนและเปลวไฟกระพริบ
                ctx.fillStyle = '#fff';
                ctx.fillRect(-1.5, -16, 3, 10);
                const flicker = Math.sin(time * 0.02) * 1.2;
                ctx.fillStyle = '#ffea00';
                ctx.beginPath();
                ctx.ellipse(flicker * 0.4, -19, 3, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function drawLanternArt(x, y, scale, time) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);

                const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 32);
                glow.addColorStop(0, 'rgba(255, 180, 50, 0.85)');
                glow.addColorStop(1, 'rgba(255, 120, 0, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0, 0, 32, 0, Math.PI * 2);
                ctx.fill();

                const bodyGrad = ctx.createLinearGradient(0, -18, 0, 14);
                bodyGrad.addColorStop(0, '#ff9f1c');
                bodyGrad.addColorStop(1, '#fff3b0');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.moveTo(-13, -16);
                ctx.lineTo(13, -16);
                ctx.lineTo(9, 14);
                ctx.lineTo(-9, 14);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            // รายการกระทงที่ลอยในแม่น้ำ โคมลอยบนฟ้า และพลุ
            const floatingKrathongs = [];
            const floatingLanterns = [];
            const fireworks = [];

            function spawnFirework(x, y, color) {
                const particles = [];
                for (let i = 0; i < 42; i++) {
                    const angle = (Math.PI * 2 * i) / 42;
                    const speed = Math.random() * 2.6 + 1.2;
                    particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        alpha: 1,
                        color
                    });
                }
                fireworks.push(particles);
            }

            // ==========================================
            // 4. ระบบเสียงเพลง "รำวงวันลอยกระทง" ของไทย
            // ==========================================
            let audioCtx = null;
            let songTimer = null;

            function initAudio() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            const loyKrathongSong = [
                { f: 392.00, d: 0.35 }, { f: 392.00, d: 0.35 }, { f: 440.00, d: 0.35 }, { f: 392.00, d: 0.35 }, { f: 523.25, d: 0.70 },
                { f: 440.00, d: 0.35 }, { f: 523.25, d: 0.35 }, { f: 587.33, d: 0.35 }, { f: 523.25, d: 0.35 }, { f: 440.00, d: 0.35 }, { f: 392.00, d: 0.70 },
                { f: 392.00, d: 0.35 }, { f: 392.00, d: 0.35 }, { f: 440.00, d: 0.35 }, { f: 392.00, d: 0.35 }, { f: 523.25, d: 0.70 },
                { f: 440.00, d: 0.25 }, { f: 523.25, d: 0.25 }, { f: 587.33, d: 0.35 }, { f: 659.25, d: 0.50 },
                { f: 587.33, d: 0.35 }, { f: 523.25, d: 0.35 }, { f: 440.00, d: 0.25 }, { f: 392.00, d: 0.25 }, { f: 523.25, d: 0.85 },
                { f: 659.25, d: 0.55 }, { f: 659.25, d: 0.55 }, { f: 587.33, d: 0.25 }, { f: 523.25, d: 0.25 }, { f: 587.33, d: 0.70 },
                { f: 523.25, d: 0.55 }, { f: 523.25, d: 0.55 }, { f: 440.00, d: 0.25 }, { f: 392.00, d: 0.25 }, { f: 440.00, d: 0.70 },
                { f: 392.00, d: 0.35 }, { f: 440.00, d: 0.25 }, { f: 523.25, d: 0.25 }, { f: 587.33, d: 0.35 }, { f: 659.25, d: 0.35 }, { f: 587.33, d: 0.50 },
                { f: 523.25, d: 0.35 }, { f: 440.00, d: 0.35 }, { f: 392.00, d: 0.35 }, { f: 329.63, d: 0.35 },
                { f: 392.00, d: 0.35 }, { f: 440.00, d: 0.35 }, { f: 523.25, d: 0.35 }, { f: 523.25, d: 0.90 }
            ];

            let noteIdx = 0;
            function playNextSongNote() {
                if (!soundEnabled || !audioCtx) return;
                const note = loyKrathongSong[noteIdx];
                const now = audioCtx.currentTime;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(note.f, now);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.14, now + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, now + note.d * 0.95);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + note.d);

                if (noteIdx % 2 === 0) {
                    const chingOsc = audioCtx.createOscillator();
                    const chingGain = audioCtx.createGain();
                    chingOsc.type = 'sine';
                    chingOsc.frequency.setValueAtTime(noteIdx % 4 === 0 ? 2400 : 1800, now);
                    chingGain.gain.setValueAtTime(0.03, now);
                    chingGain.gain.exponentialRampToValueAtTime(0.0001, now + (noteIdx % 4 === 0 ? 0.25 : 0.08));
                    chingOsc.connect(chingGain);
                    chingGain.connect(audioCtx.destination);
                    chingOsc.start(now);
                    chingOsc.stop(now + 0.25);
                }

                noteIdx = (noteIdx + 1) % loyKrathongSong.length;
                songTimer = setTimeout(playNextSongNote, note.d * 1000);
            }

            function playGiftFx(tier) {
                if (!soundEnabled) return;
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                if (tier >= 5) {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(35, now + 0.6);
                    gain.gain.setValueAtTime(0.32, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.35);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                }
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.6);
            }

            startBtn.addEventListener('click', () => {
                startOverlay.style.display = 'none';
                initAudio();
                if (soundEnabled && !songTimer) playNextSongNote();
            });

            const soundBtn = document.getElementById('sound-toggle');
            soundBtn.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                soundBtn.innerHTML = soundEnabled ? '🔊 เสียงเพลง: เปิด' : '🔇 เสียงเพลง: ปิด';
                soundBtn.style.background = soundEnabled ? '#ff9800' : '#757575';
                if (soundEnabled) {
                    initAudio();
                    if (!songTimer) playNextSongNote();
                } else if (songTimer) {
                    clearTimeout(songTimer);
                    songTimer = null;
                }
            });

            // ==========================================
            // 5. การเดินไปลอยกระทง + ปุ่มทดสอบ 7 ระดับ
            // ==========================================
            const giftTierMap = {
                'Rose': 1, 'TikTok': 1,
                'Finger Heart': 2, 'Doughnut': 2,
                'Perfume': 3, 'Cap': 3,
                'Paper Crane': 4,
                'Fireworks': 5,
                'Dragon': 6,
                'Universe': 7
            };

            function triggerLoyKrathong(username, giftName, forcedTier = null) {
                const tier = forcedTier || giftTierMap[giftName] || 1;
                totalCount++;
                totalCountEl.innerText = totalCount.toLocaleString();
                totalCountEl.classList.add('counter-pop');
                setTimeout(() => totalCountEl.classList.remove('counter-pop'), 200);

                playGiftFx(tier);

                const idleChars = characters.filter(c => c.state === 'idle');
                const ch = idleChars.length > 0
                    ? idleChars[Math.floor(Math.random() * idleChars.length)]
                    : characters[Math.floor(Math.random() * characters.length)];

                ch.state = 'walkingUp';
                ch.heldTier = tier;
                ch.username = username;
            }

            if (socket) {
                socket.on('new_gift', (data) => {
                    triggerLoyKrathong(data.username, data.giftName);
                });
            }

            document.querySelectorAll('.btn-tier[data-tier]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tier = parseInt(btn.getAttribute('data-tier'));
                    const mockUsers = ['พี่โอ๊ต', 'สายมู', 'น้องแป้ง', 'NARAPONZ'];
                    const randomUser = mockUsers[Math.floor(Math.random() * mockUsers.length)];
                    triggerLoyKrathong(randomUser, '', tier);
                });
            });

            // ==========================================
            // 6. Main Animation Loop
            // ==========================================
            function loop(time) {
                requestAnimationFrame(loop);
                ctx.clearRect(0, 0, W, H);

                // วาดฉากหลังวัดอรุณฯ แม่น้ำ และท่าน้ำ
                drawBackground(time);

                // อัปเดตและวาดกระทงที่ลอยอยู่ในแม่น้ำ (ลอยไกลออกไปช้าๆ และเล็กลงตาม Perspective)
                for (let i = floatingKrathongs.length - 1; i >= 0; i--) {
                    const k = floatingKrathongs[i];
                    k.y -= 0.00055;
                    k.x += Math.sin(time * 0.002 + k.seed) * 0.00025;
                    const progress = (0.62 - k.y) / (0.62 - 0.45);
                    const scale = Math.max(0.25, 0.85 * (1 - progress * 0.72));

                    drawKrathongArt(k.x * W, k.y * H, k.tier, scale, time);

                    if (k.y <= 0.45) {
                        floatingKrathongs.splice(i, 1);
                    }
                }

                // อัปเดตและวาดโคมลอยขึ้นสู่ท้องฟ้า
                for (let i = floatingLanterns.length - 1; i >= 0; i--) {
                    const l = floatingLanterns[i];
                    l.y -= 0.0014;
                    l.x += Math.sin(time * 0.003 + l.seed) * 0.0006;
                    const scale = Math.max(0.2, 0.85 * (l.y / 0.55));
                    drawLanternArt(l.x * W, l.y * H, scale, time);

                    if (l.y < -0.05) {
                        floatingLanterns.splice(i, 1);
                    }
                }

                // อัปเดตการเดินของตัวละคร (เรียงลำดับจากไกลมาใกล้เพื่อไม่ให้ซ้อนทับผิดมิติ)
                const sortedChars = [...characters].sort((a, b) => a.y - b.y);
                sortedChars.forEach(ch => {
                    if (ch.state === 'walkingUp') {
                        ch.walkPhase += 0.22;
                        ch.y -= 0.0022;
                        if (ch.y <= 0.655) {
                            ch.y = 0.655;
                            // ปล่อยกระทงลงน้ำ หรือปล่อยโคมลอยขึ้นฟ้า
                            if (ch.heldTier === 4) {
                                floatingLanterns.push({ x: ch.x, y: 0.56, seed: Math.random() * 10 });
                            } else {
                                floatingKrathongs.push({ x: ch.x, y: 0.615, tier: ch.heldTier, seed: Math.random() * 10 });
                            }

                            // จุดพลุฉลองถ้าเป็น Tier 5-7
                            if (ch.heldTier >= 5) {
                                const fwColors = ['#ff0055', '#00e5ff', '#ffd700', '#ff9f1c', '#b5179e'];
                                const count = ch.heldTier === 5 ? 2 : (ch.heldTier === 6 ? 4 : 7);
                                for (let b = 0; b < count; b++) {
                                    setTimeout(() => {
                                        spawnFirework(
                                            W * (0.2 + Math.random() * 0.6),
                                            H * (0.12 + Math.random() * 0.22),
                                            fwColors[Math.floor(Math.random() * fwColors.length)]
                                        );
                                    }, b * 300);
                                }
                            }

                            ch.heldTier = 0;
                            ch.state = 'walkingBack';
                        }
                    } else if (ch.state === 'walkingBack') {
                        ch.walkPhase += 0.22;
                        ch.y += 0.0022;
                        if (ch.y >= ch.homeY) {
                            ch.y = ch.homeY;
                            ch.state = 'idle';
                            ch.username = '';
                        }
                    }

                    drawCartoonCharacter(ch, time);
                });

                // วาดพลุบนท้องฟ้า
                for (let i = fireworks.length - 1; i >= 0; i--) {
                    const fw = fireworks[i];
                    let alive = false;
                    fw.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.035;
                        p.alpha -= 0.016;
                        if (p.alpha > 0) {
                            alive = true;
                            ctx.fillStyle = p.color;
                            ctx.globalAlpha = p.alpha;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });
                    ctx.globalAlpha = 1;
                    if (!alive) fireworks.splice(i, 1);
                }
            }

            requestAnimationFrame(loop);
        });
    </script>
