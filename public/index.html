<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loy Krathong 3D Live Stream</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #020712;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 🔘 หน้าจอต้อนรับเพื่อปลดล็อกเสียงบนมือถือ */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(2, 7, 18, 0.92);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #start-btn {
            margin-top: 24px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            color: #020712;
            background: linear-gradient(135deg, #ffd700, #ff9800);
            border: none;
            border-radius: 30px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            cursor: pointer;
        }

        /* 🏆 ป้ายนับยอดกระทงมุมขวาบน */
        #counter-box {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            border: 1.5px solid #ffd700;
            border-radius: 20px;
            padding: 6px 14px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 10px rgba(255, 215, 0, 0.3);
            z-index: 100;
        }
        #counter-box .title {
            font-size: 11px;
            color: #ffe066;
        }
        #counter-box .number {
            font-size: 20px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 8px #ff9800;
        }

        /* 🎛️ ปุ่มเครื่องมือทดสอบ */
        #toggle-panel-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            z-index: 101;
        }

        #test-panel {
            position: absolute;
            top: 52px;
            left: 15px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 160px;
        }
        #test-panel.show {
            display: flex;
        }
        .btn-tier {
            padding: 7px 10px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            text-align: left;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h2>🪷 ระบบลอยกระทง 3D Interactive 🪷</h2>
        <p style="font-size: 13px; margin-top: 8px; color: #ffe066;">แตะปุ่มด้านล่างเพื่อเปิดระบบเสียงและเข้าสู่ฉากลอยกระทง 3D</p>
        <button id="start-btn">🎵 เริ่มต้นใช้งาน</button>
    </div>

    <div id="canvas-container"></div>

    <button id="toggle-panel-btn">⚙️ เครื่องมือ</button>

    <div id="test-panel">
        <button id="sound-toggle" class="btn-tier" style="background:#ff9800; color:#000; text-align:center;">🔊 เสียง: เปิด</button>
        <button class="btn-tier" data-tier="1" style="background: #8ecae6; color:#000;">T1: ลอยกระทงเล็ก</button>
        <button class="btn-tier" data-tier="2" style="background: #2a9d8f;">T2: ลอยกระทงตอง</button>
        <button class="btn-tier" data-tier="3" style="background: #e9c46a; color:#000;">T3: ลอยกระทงทอง</button>
        <button class="btn-tier" data-tier="4" style="background: #f4a261;">T4: ปล่อยโคมลอย</button>
        <button class="btn-tier" data-tier="5" style="background: #e76f51;">T5: จุดพลุฉลอง</button>
    </div>

    <div id="counter-box">
        <span style="font-size:16px;">🪷</span>
        <div>
            <div class="title">ร่วมลอยกระทง</div>
            <div id="total-count" class="number">0</div>
        </div>
        <span class="title">ใบ</span>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const socket = typeof io !== 'undefined' ? io() : null;
            const container = document.getElementById('canvas-container');
            const totalCountEl = document.getElementById('total-count');
            const startOverlay = document.getElementById('start-overlay');
            const startBtn = document.getElementById('start-btn');
            const toggleBtn = document.getElementById('toggle-panel-btn');
            const testPanel = document.getElementById('test-panel');

            let totalCount = 0;
            let soundEnabled = true;

            toggleBtn.addEventListener('click', () => {
                testPanel.classList.toggle('show');
            });

            // --- 🎥 ตั้งค่า Three.js 3D Scene ---
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020712);
            scene.fog = new THREE.FogExp2(0x020712, 0.025);

            const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, 11);
            camera.lookAt(0, 1.5, -2);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 💡 แสงสว่างคืนวันเพ็ญ
            const ambientLight = new THREE.AmbientLight(0x405070, 0.8);
            scene.add(ambientLight);

            const moonLight = new THREE.DirectionalLight(0xffea79, 1.2);
            moonLight.position.set(8, 15, -10);
            scene.add(moonLight);

            // 🌕 ดวงจันทร์ 3D
            const moonGeo = new THREE.SphereGeometry(2, 32, 32);
            const moonMat = new THREE.MeshBasicMaterial({ color: 0xfffae6 });
            const moon = new THREE.Mesh(moonGeo, moonMat);
            moon.position.set(8, 14, -20);
            scene.add(moon);

            // 🌊 แม่น้ำเจ้าพระยา (ด้านหน้า Z: -3 ถึง -15)
            const riverGeo = new THREE.PlaneGeometry(30, 20);
            const riverMat = new THREE.MeshStandardMaterial({ color: 0x051a30, roughness: 0.1, metalness: 0.8 });
            const river = new THREE.Mesh(riverGeo, riverMat);
            river.rotation.x = -Math.PI / 2;
            river.position.set(0, 0, -8);
            scene.add(river);

            // 🧱 ตลิ่ง/ลานทางเดิน (ด้านหลัง Z: -3 ถึง 10)
            const groundGeo = new THREE.PlaneGeometry(30, 15);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a2636, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.set(0, 0.05, 4.5);
            scene.add(ground);

            // 🕯️ ฟังก์ชันสร้างโมเดลกระทง 3D
            function createKrathongMesh() {
                const group = new THREE.Group();
                // ฐานใบตอง
                const baseGeo = new THREE.CylinderGeometry(0.4, 0.45, 0.15, 12);
                const baseMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f });
                const base = new THREE.Mesh(baseGeo, baseMat);
                group.add(base);

                // ดอกไม้/เทียน
                const candleGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.3, 8);
                const candleMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
                const candle = new THREE.Mesh(candleGeo, candleMat);
                candle.position.y = 0.2;
                group.add(candle);

                // แสงเทียนเรืองแสง
                const light = new THREE.PointLight(0xffaa00, 1.5, 3);
                light.position.y = 0.4;
                group.add(light);

                return group;
            }

            // 👤 ฟังก์ชันสร้างตัวละคร 3D
            const avatars = [];
            function createAvatar(x, z) {
                const group = new THREE.Group();
                
                // หัว
                const headGeo = new THREE.SphereGeometry(0.28, 16, 16);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 1.35;
                group.add(head);

                // ตัว (ชุดไทย/เสื้อสีสดใส)
                const bodyGeo = new THREE.CylinderGeometry(0.22, 0.32, 0.95, 16);
                const bodyMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.65;
                group.add(body);

                group.position.set(x, 0.05, z);
                scene.add(group);
                return group;
            }

            // สร้างตัวละครยืนเป็นแถวเรียงกันริมตลิ่ง
            for(let x = -4; x <= 4; x += 1.3) {
                for(let z = 3; z <= 7; z += 1.6) {
                    avatars.push(createAvatar(x, z));
                }
            }

            // 🚶‍♂️ แอนิเมชัน: ถือกระทงเดินไปริมน้ำ -> วางกระทงลงแม่น้ำ -> กระทงค่อยๆ ลอยออกไป
            function animateWalkToRiver(avatar) {
                const startX = avatar.position.x;
                const startZ = avatar.position.z;
                const targetZ = -2.8; // จุดริมแม่น้ำ

                // สร้างกระทงให้ตัวละครถือ
                const krathong = createKrathongMesh();
                krathong.position.set(0, 0.8, -0.4);
                avatar.add(krathong);

                let progress = 0;
                const walkInterval = setInterval(() => {
                    progress += 0.025;
                    avatar.position.z = THREE.MathUtils.lerp(startZ, targetZ, progress);
                    avatar.position.y = 0.05 + Math.abs(Math.sin(progress * Math.PI * 10)) * 0.12;

                    if (progress >= 1) {
                        clearInterval(walkInterval);

                        // 🪷 วางกระทงลงน้ำ
                        avatar.remove(krathong);
                        krathong.position.set(avatar.position.x, 0.1, targetZ);
                        scene.add(krathong);

                        // กระทงค่อยๆ ลอยออกไปตามแม่น้ำ
                        let floatProgress = 0;
                        const floatInterval = setInterval(() => {
                            floatProgress += 0.005;
                            krathong.position.z -= 0.03;
                            krathong.position.x += Math.sin(floatProgress * 10) * 0.01; // ลอยพริ้วไหว
                            krathong.position.y = 0.08 + Math.sin(floatProgress * 15) * 0.03; // คลื่นน้ำ

                            if (krathong.position.z < -15) {
                                clearInterval(floatInterval);
                                scene.remove(krathong);
                            }
                        }, 30);

                        // ตัวละครเดินกลับเข้าแถวเดิม
                        setTimeout(() => {
                            let backProgress = 0;
                            const backInterval = setInterval(() => {
                                backProgress += 0.025;
                                avatar.position.z = THREE.MathUtils.lerp(targetZ, startZ, backProgress);
                                avatar.position.y = 0.05 + Math.abs(Math.sin(backProgress * Math.PI * 10)) * 0.12;
                                if (backProgress >= 1) clearInterval(backInterval);
                            }, 30);
                        }, 800);
                    }
                }, 30);
            }

            // 🎵 ระบบเสียง Web Audio Synth
            let audioCtx;
            function initAudio() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            startBtn.addEventListener('click', () => {
                startOverlay.style.display = 'none';
                initAudio();
            });

            function triggerGift(tier) {
                totalCount++;
                totalCountEl.innerText = totalCount;

                // เลือกสุ่มตัวละคร 1 ตัวเดินถือกระทงไปลอยที่แม่น้ำ
                const randomAvatar = avatars[Math.floor(Math.random() * avatars.length)];
                animateWalkToRiver(randomAvatar);
            }

            document.querySelectorAll('.btn-tier[data-tier]').forEach(btn => {
                btn.addEventListener('click', () => {
                    triggerGift(btn.getAttribute('data-tier'));
                });
            });

            if (socket) {
                socket.on('new_gift', (data) => {
                    triggerGift(1);
                });
            }

            // Render Loop
            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();

            // Responsive Screen
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
